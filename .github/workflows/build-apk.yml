# Nuby – compila un APK de prueba automáticamente en GitHub (sin Android Studio).
# Se ejecuta al subir cambios a la rama principal o manualmente desde la pestaña "Actions".
name: Compilar APK de Nuby

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # El día 1 de cada mes: recompila con la biblioteca médica actualizada
    - cron: '17 9 1 * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nuby-build
  cancel-in-progress: true

jobs:
  apk:
    name: APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar proyecto (descomprime el ZIP si lo subiste así)
        shell: bash
        run: |
          set -e
          if [ -f package.json ] && [ -f www/index.html ]; then
            echo "Proyecto ya descomprimido en el repositorio."
          else
            ZIP="nuby.beta_1.4.zip"
            if [ ! -f "$ZIP" ]; then ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" -printf "%f\n" | head -n1); fi
            if [ -z "$ZIP" ]; then echo "::error::No encuentro package.json ni un archivo .zip con el proyecto en la raíz del repositorio."; exit 1; fi
            echo "Descomprimiendo $ZIP"
            rm -rf /tmp/nuby && mkdir -p /tmp/nuby && unzip -q "$ZIP" -d /tmp/nuby
            PKG=$(find /tmp/nuby -name package.json -not -path '*/node_modules/*' | head -n1)
            if [ -z "$PKG" ]; then echo "::error::El ZIP no contiene package.json"; exit 1; fi
            cp -a "$(dirname "$PKG")"/. ./
          fi
          test -f www/index.html
          test -f android-config/nuby-debug.keystore

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias (Capacitor)
        run: npm install --no-audit --no-fund

      - name: Construir biblioteca médica (MedlinePlus en español + openFDA)
        run: node scripts/build-kb.mjs

      - name: Crear proyecto Android
        run: |
          if [ ! -d android ]; then npx cap add android; else echo "La carpeta android ya existe"; fi

      - name: Configurar Android (iconos, permisos, firma, versión)
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: node scripts/configure-android.mjs

      - name: Copiar la app web al proyecto Android
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renombrar APK
        id: apk
        run: |
          NAME="Nuby-1.6.${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$NAME"
          ls -lh "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Nuby-APK-${{ github.run_number }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 30

      - name: Publicar APK en "Releases" (descarga directa desde el celular)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e "const m=require('./www/kb/manifest.json');const l=m.packs.map(p=>'- '+(p.ok?'✅ ':'❌ ')+p.title+': '+(p.count||0)+(p.sourceDate?' (fuente '+p.sourceDate+')':'')+(p.ok?'':' — '+(p.error||'no disponible')));require('fs').writeFileSync('release-notes.md','APK de prueba compilado automáticamente. Descarga el archivo .apk de abajo e instálalo en tu Android.\n\n**Biblioteca médica incluida** (generada '+m.built.slice(0,10)+'):\n'+l.join('\n')+'\n')"
          cat release-notes.md
          gh release delete apk-prueba --cleanup-tag --yes || true
          gh release create apk-prueba "${{ steps.apk.outputs.name }}" \
            --target "${{ github.sha }}" --prerelease \
            --title "Nuby APK de prueba #${{ github.run_number }}" \
            --notes-file release-notes.md

  web:
    name: Versión web (GitHub Pages, opcional)
    runs-on: ubuntu-latest
    # Si GitHub Pages no está activado, este paso falla sin afectar al APK.
    continue-on-error: true
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Preparar proyecto
        shell: bash
        run: |
          if [ ! -f www/index.html ]; then
            ZIP="nuby.beta_1.4.zip"
            if [ ! -f "$ZIP" ]; then ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" -printf "%f\n" | head -n1); fi
            if [ -z "$ZIP" ]; then echo "::error::No hay ZIP en la raíz del repositorio"; exit 1; fi
            mkdir -p /tmp/nuby && unzip -q "$ZIP" -d /tmp/nuby
            PKG=$(find /tmp/nuby -name package.json -not -path '*/node_modules/*' | head -n1)
            if [ -z "$PKG" ]; then echo "::error::No encuentro package.json dentro del ZIP"; exit 1; fi
            cp -a "$(dirname "$PKG")"/. ./
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Construir biblioteca médica
        run: node scripts/build-kb.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - uses: actions/deploy-pages@v4
      
